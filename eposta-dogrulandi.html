<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>E-posta doğrulandı | İslami Asistan</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#14171c;--muted:#5b6470;--accent:#5b6cf0;--ok:#1f9d55}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d10;--card:#171a20;--fg:#eef0f3;--muted:#9aa3af;--accent:#8f99ff;--ok:#4cc38a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:420px;width:100%;background:var(--card);border-radius:20px;padding:32px 24px;text-align:center;box-shadow:0 6px 30px rgba(0,0,0,.08)}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok);margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.tick svg{width:34px;height:34px}
h1{font-size:22px;margin:0 0 8px}
p{margin:0 0 20px;color:var(--muted)}
a.btn{display:inline-block;padding:13px 26px;border-radius:14px;background:var(--accent);color:#0b0d10;font-weight:600;text-decoration:none}
small{display:block;margin-top:18px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
<div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
<h1>E-posta adresin doğrulandı</h1>
<p>Hesabın hazır. İslami Asistan uygulamasına dönüp e-posta ve şifrenle giriş yapabilirsin.</p>
<a class="btn" href="com.hbdsource.islamiasistan://login-callback">Uygulamayı aç</a>
<small>Düğme çalışmazsa bu sayfayı kapatıp uygulamaya kendin dön.</small>
</main>
</body>
</html>
