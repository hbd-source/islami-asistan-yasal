<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İslami Asistan'ı indir</title>
<meta property="og:title" content="İslami Asistan">
<meta property="og:description" content="Namaz vakitleri, kıble, Kur'an ve cami bulma tek uygulamada.">
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#14171c;--muted:#5b6470;--accent:#5b6cf0}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d10;--card:#171a20;--fg:#eef0f3;--muted:#9aa3af;--accent:#8f99ff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:420px;width:100%;background:var(--card);border-radius:20px;padding:32px 24px;text-align:center;box-shadow:0 6px 30px rgba(0,0,0,.08)}
h1{font-size:22px;margin:0 0 8px}
p{margin:0 0 20px;color:var(--muted)}
a.btn{display:block;margin:10px 0;padding:13px 26px;border-radius:14px;background:var(--accent);color:#0b0d10;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
<h1>İslami Asistan</h1>
<p>Namaz vakitleri, kıble, Kur'an ve cami bulma tek uygulamada.</p>
<a class="btn" id="ios" href="https://apps.apple.com/app/id6818768759">App Store'dan indir</a>
<a class="btn" id="and" href="https://play.google.com/store/apps/details?id=com.hbdsource.islamiasistan">Google Play'den indir</a>
</main>
<script>
(function(){
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  // Telefonda dogrudan o telefonun magazasina gider; bilgisayarda iki dugme kalir.
  if (isAndroid) { document.getElementById('ios').style.display = 'none'; location.replace(document.getElementById('and').href); }
  else if (isIOS) { document.getElementById('and').style.display = 'none'; location.replace(document.getElementById('ios').href); }
})();
</script>
</body>
</html>
